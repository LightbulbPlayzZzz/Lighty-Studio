<script>
// ================== BASIC CONFIG ==================
const APP_VERSION = "3.1";
const ownerName = "LightbulbPlayzZzz";

// ⚠️ encoded instead of plain (still simple, but better)
function hashPassword(p) {
    return btoa(p); 
}

let currentUser = localStorage.getItem("lightyUser") || null;

// ================== STORAGE ==================
function getUsers() {
    return JSON.parse(localStorage.getItem("allUsers")) || [];
}

function saveUsers(users) {
    localStorage.setItem("allUsers", JSON.stringify(users));
}

// ================== AUTH ==================
function checkRegister() {
    const u = document.getElementById("regUser").value.trim();
    const p = document.getElementById("regPass").value;

    if (u.length < 3 || u.length > 20) {
        return showNotification("Invalid username", "error");
    }
    if (p.length < 6) {
        return showNotification("Password too short", "error");
    }

    let users = getUsers();

    if (users.find(x => x.username === u)) {
        return showNotification("Username taken", "error");
    }

    users.push({
        username: u,
        password: hashPassword(p),
        createdAt: new Date().toISOString()
    });

    saveUsers(users);

    localStorage.setItem("lightyUser", u);
    currentUser = u;

    showNotification("Account created!", "success");
    location.reload();
}

function checkLogin() {
    const u = document.getElementById("loginUser").value.trim();
    const p = document.getElementById("loginPass").value;

    let users = getUsers();

    const found = users.find(
        x => x.username === u && x.password === hashPassword(p)
    );

    if (!found) {
        return showNotification("Invalid login", "error");
    }

    localStorage.setItem("lightyUser", u);
    currentUser = u;

    showNotification("Welcome back!", "success");
    location.reload();
}

// ================== POSTS ==================
function addPost() {
    const title = document.getElementById("postTitle").value.trim();
    const link = document.getElementById("postLink").value.trim();
    const desc = document.getElementById("postDesc").value.trim();

    if (!title || !link) {
        return showNotification("Missing fields", "error");
    }

    let posts = JSON.parse(localStorage.getItem("gamePosts")) || [];

    posts.unshift({
        id: Date.now(),
        user: currentUser,
        title,
        link,
        desc
    });

    localStorage.setItem("gamePosts", JSON.stringify(posts));

    showNotification("Posted!", "success");
    loadPosts();
}

// ================== POSTS LOAD ==================
function loadPosts() {
    const feed = document.getElementById("feed");
    feed.innerHTML = "";

    let posts = JSON.parse(localStorage.getItem("gamePosts")) || [];

    posts.forEach(p => {
        const div = document.createElement("div");
        div.className = "game-card";

        div.innerHTML = `
            <strong>${p.title}</strong><br>
            <small>by ${p.user}</small><br>
            <button onclick="window.open('${p.link}')">Download</button>
            <p>${p.desc}</p>
        `;

        feed.appendChild(div);
    });
}
</script>
